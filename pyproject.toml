[project]
name = "mintcall"
version = "0.1.0"
description = "aether-cell mintcall: local mint-on-call credential broker for AI agents"
requires-python = ">=3.10"
dependencies = ["cryptography>=41"]
license = {text = "Apache-2.0"}
[project.optional-dependencies]
keyring = ["keyring"]
[project.scripts]
mintcall = "mintcall.cli:main"
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[tool.setuptools]
packages = ["mintcall"]
